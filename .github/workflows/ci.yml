name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Test
        run: cargo nextest run --profile ci

  coverage:
    # Coverage delta gate: fail when project line coverage (C0) drops vs main.
    # Measures base-vs-head total C0, not diff-cover changed-lines: a changed-
    # lines gate false-fails move-only refactors (relocated tested lines look
    # "new and uncovered"), while base-vs-head cancels relocations out and still
    # catches genuinely new untested code. No absolute floor, so existing
    # unreachable code is never flagged (only a drop vs main fails).
    # test_utils.rs is excluded (--ignore-filename-regex): it is a #[cfg(test)]
    # helper, so the gate measures production-line coverage only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Coverage delta gate (project C0 must not drop vs main)
        run: |
          set -euo pipefail
          # Sum LH (lines hit) / LF (lines found) across an lcov report -> C0 %.
          c0() { awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f==0) print "100.0"; else printf "%.4f", h*100/f }' "$1"; }
          # HEAD = PR merged into main (the checked-out pull_request ref).
          # cargo llvm-cov cleans stale profraw at the start of each run, so the
          # two measurements below do not mix.
          # Run via nextest (process-per-test), not libtest (thread-per-test): #59.
          # libtest runs every test in one process, so a thread writing a fake bin
          # holds a writable fd that a sibling thread's Command::spawn fork()
          # inherits; the later exec of that bin then trips ETXTBSY
          # (deny_write_access). llvm-cov instrumentation widens the window enough
          # to flake. nextest isolates each test in its own process, so no sibling
          # shares the fd table and the cross-test fd inheritance cannot happen.
          # This matches the test job's runner and fixes both head and base
          # (base still runs main's pre-fix write-then-exec paths until #59 lands).
          # gates has no lib target, so there are no doctests for nextest to skip;
          # coverage stays equivalent to the libtest run.
          cargo llvm-cov nextest --profile ci --ignore-filename-regex 'src/test_utils\.rs$' --lcov --output-path head.info
          head_c0=$(c0 head.info)
          # BASE = main (fetch-depth:0 already has the history).
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --quiet --force origin/main
          cargo llvm-cov nextest --profile ci --ignore-filename-regex 'src/test_utils\.rs$' --lcov --output-path base.info
          base_c0=$(c0 base.info)
          # 0.1pp tolerance absorbs instrumentation rounding / total line drift.
          awk -v b="$base_c0" -v h="$head_c0" 'BEGIN {
            printf "C0 coverage: main %.2f%% -> PR %.2f%%\n", b, h
            if (h + 0.1 < b) {
              printf "::error::C0 coverage dropped %.2f%% -> %.2f%% (tolerance 0.1pp)\n", b, h
              exit 1
            }
            print "OK: coverage did not drop"
          }'

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny@0.19.6

      - name: Install cargo-audit
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit@0.22.1

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit

[package]
name = "gates"
version = "0.12.0"
edition = "2024"
description = "Claude Code completion hook for parallel gate execution"
license = "MIT"

[[bin]]
name = "gates"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = ">=1"
regex = ">=1"
# Secure temp dir for the jscpd report (CWE-377): random, O_EXCL-atomic name so
# a predictable PID-based path can't be pre-created/symlinked in world-writable
# $TMPDIR. Compile-time-only weight; runtime cost is one dir create per jscpd run.
tempfile = ">=3"
# litmus is a first-party git dependency with no semver releases. A bare git dep
# floats to the default-branch HEAD on `cargo update`, which is a stability hazard
# for a per-edit hook, so pin it by rev. The registry crates below (oxc/serde/regex)
# stay on `>=` ranges; pinning those floats is tracked separately, out of #94 scope.
litmus = { git = "https://github.com/thkt/litmus.git", rev = "4ee5b6a6875ba6e7dfa210fc6b98cbc528603272" }
oxc_allocator = ">=0.121"
oxc_ast = { version = ">=0.121", features = ["serialize"] }
oxc_parser = ">=0.121"
oxc_span = ">=0.121"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# absolute paths
absolute_paths = "deny"
# idiomatic iterators
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
